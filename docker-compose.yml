version: '3.8'

services:
  datacopilot-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change_me_super_secret_jwt_key_32_chars_min}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_PROVIDER_ORDER=ollama,groq,fallback
      - LOG_LEVEL=INFO
    volumes:
      - app_data:/app/data
      - app_indices:/app/indices
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  app_data:
  app_indices:
  ollama_models:
