services:
  - type: web
    name: datacopilot-ai
    env: python
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER_ORDER
        value: groq,fallback
      - key: GROQ_API_KEY
        sync: false
